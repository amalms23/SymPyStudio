name: tests

on:
  push:
  pull_request:

jobs:
  kernel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # Pyodide 0.26.1 ships CPython 3.12 with SymPy 1.12 / mpmath 1.3.0
          python-version: '3.12'
      - name: Install SymPy (same version as the browser kernel)
        run: pip install "sympy==1.12" "mpmath==1.3.0"
      - name: Parser and kernel tests
        run: python -m unittest discover -s tests -v
      - name: kernel_bundle.js matches kernel/
        run: python tools/build_kernel.py --check
